{% extends "base.html" %}
{% block title %}Unauthorized (401){% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="display-1 text-info fw-bold mb-3">401</div>
    <h2 class="fw-bold mb-3">Authentication Required</h2>
    <p class="text-muted mb-4">You must be logged in to view this protected resource.</p>
    <a href="{{ url_for('pages.login_page') }}" class="btn btn-primary px-4"><i class="bi bi-box-arrow-in-right me-2"></i>Log In</a>
</div>
{% endblock %}
