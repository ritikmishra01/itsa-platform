{% extends "base.html" %}
{% block title %}Rate Limit Exceeded (429){% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="display-1 text-danger fw-bold mb-3">429</div>
    <h2 class="fw-bold mb-3">Too Many Requests</h2>
    <p class="text-muted mb-4">You have exceeded the request rate limit. Please wait a moment and try again.</p>
    <a href="{{ url_for('pages.home') }}" class="btn btn-primary px-4"><i class="bi bi-arrow-clockwise me-2"></i>Back to Home</a>
</div>
{% endblock %}
