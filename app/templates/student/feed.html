{% extends "base.html" %}
{% block title %}ITSA Community Feed{% endblock %}

{% block content %}
<div class="container py-2">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <!-- Create Post Box -->
            <div class="card card-itsa p-4 mb-4 shadow-sm">
                <h5 class="fw-bold mb-3"><i class="bi bi-pencil-square text-primary me-2"></i> Share with ITSA Community</h5>
                <form id="createPostForm" enctype="multipart/form-data">
                    <div class="mb-3">
                        <textarea class="form-control" name="content" rows="3" placeholder="What's happening in tech or campus? Use #hashtags and @mentions..."></textarea>
                    </div>
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <div class="d-flex gap-2">
                            <label class="btn btn-sm btn-light border">
                                <i class="bi bi-image text-success me-1"></i> Photos
                                <input type="file" name="images" multiple accept="image/*" class="d-none">
                            </label>
                            <label class="btn btn-sm btn-light border">
                                <i class="bi bi-camera-video text-danger me-1"></i> Video
                                <input type="file" name="video" accept="video/*" class="d-none">
                            </label>
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm px-4">
                            <i class="bi bi-send-fill me-1"></i> Post (+2 pts)
                        </button>
                    </div>
                </form>
            </div>

            <!-- Feed Filter Indicator if Hashtag -->
            {% if hashtag %}
            <div class="alert alert-info d-flex justify-content-between align-items-center mb-4">
                <span>Showing posts tagged with <b>#{{ hashtag }}</b></span>
                <a href="{{ url_for('pages.social_feed') }}" class="btn btn-sm btn-outline-dark">Clear Filter</a>
            </div>
            {% endif %}

            <!-- Posts Stream Container -->
            <div id="postsStream">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <div class="small text-muted mt-2">Loading community posts...</div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
async function loadFeed() {
    const url = "{{ url_for('api_posts.get_feed') }}{% if hashtag %}?hashtag={{ hashtag }}{% endif %}";
    try {
        const res = await apiCall(url, 'GET');
        const container = document.getElementById('postsStream');
        if (!res.data || res.data.length === 0) {
            container.innerHTML = `
                <div class="card card-itsa p-5 text-center text-muted">
                    <i class="bi bi-chat-left-dots fs-1 mb-2"></i>
                    <h5>No posts yet</h5>
                    <p class="small">Be the first to share an update or project idea with the ITSA community!</p>
                </div>
            `;
            return;
        }

        container.innerHTML = res.data.map(p => `
            <div class="post-card p-4 shadow-sm" id="post_${p.id}">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="post-avatar">${p.author_name ? p.author_name[0] : 'U'}</div>
                        <div>
                            <div class="fw-bold">${p.author_name || 'Anonymous'}</div>
                            <div class="small text-muted">${new Date(p.created_at).toLocaleDateString()} at ${new Date(p.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                        </div>
                    </div>
                    <div class="dropdown">
                        <button class="btn btn-light btn-sm rounded-circle" data-bs-toggle="dropdown"><i class="bi bi-three-dots-vertical"></i></button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><button class="dropdown-item small" onclick="reportPost(${p.id})"><i class="bi bi-flag me-2"></i> Report Post</button></li>
                        </ul>
                    </div>
                </div>

                <div class="mb-3 lh-base" style="white-space: pre-wrap;">${p.content || ''}</div>

                ${p.media && p.media.length > 0 ? `
                    <div class="mb-3 rounded-3 overflow-hidden border">
                        ${p.media.map(m => m.media_type === 'IMAGE' ? `<img src="/${m.file_path}" class="w-100 object-fit-cover mb-1" style="max-height: 400px;">` : `<video src="/${m.file_path}" controls class="w-100"></video>`).join('')}
                    </div>
                ` : ''}

                <!-- Action Bar -->
                <div class="d-flex align-items-center justify-content-between border-top border-bottom py-2 my-2">
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm ${p.user_reaction === 'LIKE' ? 'btn-primary' : 'btn-light'}" onclick="reactPost(${p.id}, 'LIKE')">
                            👍 Like ${p.reaction_breakdown && p.reaction_breakdown.LIKE ? `(${p.reaction_breakdown.LIKE})` : ''}
                        </button>
                        <button class="btn btn-sm ${p.user_reaction === 'LOVE' ? 'btn-danger' : 'btn-light'}" onclick="reactPost(${p.id}, 'LOVE')">
                            ❤️ Love ${p.reaction_breakdown && p.reaction_breakdown.LOVE ? `(${p.reaction_breakdown.LOVE})` : ''}
                        </button>
                        <button class="btn btn-sm ${p.user_reaction === 'CELEBRATE' ? 'btn-warning' : 'btn-light'}" onclick="reactPost(${p.id}, 'CELEBRATE')">
                            🎉 Celebrate ${p.reaction_breakdown && p.reaction_breakdown.CELEBRATE ? `(${p.reaction_breakdown.CELEBRATE})` : ''}
                        </button>
                    </div>
                    <div>
                        <span class="small text-muted"><i class="bi bi-chat-text me-1"></i> ${p.comments_count || 0} comments</span>
                    </div>
                </div>

                <!-- Comments Box -->
                <div id="comments_box_${p.id}" class="mt-3">
                    <form onsubmit="submitComment(event, ${p.id})" class="d-flex gap-2 mb-3">
                        <input type="text" name="comment_text" class="form-control form-control-sm" placeholder="Write a comment (+1 pt)..." required>
                        <button type="submit" class="btn btn-sm btn-primary">Send</button>
                    </form>
                </div>
            </div>
        `).join('');
    } catch(err) {}
}

async function reactPost(postId, reactionType) {
    try {
        await apiCall(`/api/v1/posts/${postId}/react`, 'POST', { reaction_type: reactionType });
        loadFeed();
    } catch (err) {}
}

async function submitComment(e, postId) {
    e.preventDefault();
    const input = e.target.querySelector('input[name="comment_text"]');
    try {
        await apiCall(`/api/v1/comments/post/${postId}`, 'POST', { content: input.value });
        showToast('Comment posted! (+1 ITSA point)', 'success');
        input.value = '';
        loadFeed();
    } catch(err) {}
}

async function reportPost(postId) {
    const reason = prompt("Why are you reporting this post? (SPAM, INAPPROPRIATE, HARASSMENT, OTHER):", "INAPPROPRIATE");
    if (!reason) return;
    try {
        await apiCall(`/api/v1/posts/${postId}/report`, 'POST', { reason: reason });
        showToast('Report submitted for admin review.', 'success');
    } catch(err) {}
}

document.getElementById('createPostForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    try {
        await apiCall('/api/v1/posts', 'POST', formData, true);
        showToast('Post created! (+2 ITSA points)', 'success');
        this.reset();
        loadFeed();
    } catch (err) {}
});

loadFeed();
</script>
{% endblock %}
