{% extends "base.html" %}
{% block title %}ITSA Community Feed{% endblock %}

{% block content %}
<div class="container py-2" style="max-width: 760px;">
    <!-- Create Post Box -->
    <div class="card-surface p-4 mb-4">
        <h5 class="fw-bold mb-3" style="color: var(--text-primary);"><i class="bi bi-pencil-square me-2" style="color: var(--brand-500);"></i> Share with ITSA Community</h5>
        <form id="createPostForm" enctype="multipart/form-data">
            <div class="mb-3">
                <textarea class="form-control-modern" name="content" rows="3" placeholder="What's happening in tech or campus? Use #hashtags and @mentions..."></textarea>
            </div>
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div class="d-flex gap-2">
                    <label class="btn btn-ghost btn-xs">
                        <i class="bi bi-image text-success me-1"></i> Photos
                        <input type="file" name="images" multiple accept="image/*" class="d-none">
                    </label>
                    <label class="btn btn-ghost btn-xs">
                        <i class="bi bi-camera-video text-danger me-1"></i> Video
                        <input type="file" name="video" accept="video/*" class="d-none">
                    </label>
                </div>
                <button type="submit" class="btn btn-brand btn-sm px-4">
                    <i class="bi bi-send-fill me-1"></i> Post (+2 pts)
                </button>
            </div>
        </form>
    </div>

    <!-- Feed Filter Indicator if Hashtag -->
    {% if hashtag %}
    <div class="p-3 mb-4 rounded-md d-flex justify-content-between align-items-center" style="background: var(--brand-50); border: 1px solid var(--brand-200);">
        <span class="small fw-semibold" style="color: var(--brand-700);">Showing posts tagged with <b>#{{ hashtag }}</b></span>
        <a href="{{ url_for('pages.social_feed') }}" class="btn btn-ghost btn-xs">Clear Filter</a>
    </div>
    {% endif %}

    <!-- Posts Stream Container -->
    <div id="postsStream">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <div class="small text-muted mt-2">Loading community posts...</div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
async function loadFeed() {
    const url = "{{ url_for('api_posts.get_feed') }}{% if hashtag %}?hashtag={{ hashtag }}{% endif %}";
    try {
        const res = await apiCall(url, 'GET');
        const container = document.getElementById('postsStream');
        if (!res.data || res.data.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon"><i class="bi bi-chat-heart"></i></div>
                    <div class="empty-state-title">No posts yet</div>
                    <div class="empty-state-desc">Be the first to share an update, tech discovery, or event memory!</div>
                </div>
            `;
            return;
        }

        container.innerHTML = res.data.map(p => `
            <div class="feed-post-card" id="post-${p.id}">
                <div class="feed-author">
                    <div class="topbar-avatar-btn" style="width: 40px; height: 40px; font-size: 1rem;">
                        ${(p.author_name || 'U')[0].toUpperCase()}
                    </div>
                    <div>
                        <div class="fw-bold small" style="color: var(--text-primary);">${p.author_name}</div>
                        <div class="small text-muted" style="font-size: 0.75rem;">${p.created_at || 'Recently'} &bull; <span class="badge-brand">${p.author_role || 'STUDENT'}</span></div>
                    </div>
                </div>

                <div class="mt-3" style="color: var(--text-primary); line-height: 1.6; white-space: pre-wrap;">${p.content}</div>

                <div class="d-flex gap-2 mt-3 pt-2 border-top" style="border-color: var(--border-subtle) !important;">
                    <button class="reaction-btn" onclick="reactPost(${p.id}, 'LIKE', this)">
                        👍 <span class="reaction-count">${p.reactions_count || 0}</span>
                    </button>
                    <button class="reaction-btn" onclick="reactPost(${p.id}, 'LOVE', this)">
                        ❤️
                    </button>
                    <button class="reaction-btn" onclick="reactPost(${p.id}, 'CELEBRATE', this)">
                        🎉
                    </button>
                </div>
            </div>
        `).join('');
    } catch(e) {
        document.getElementById('postsStream').innerHTML = '<div class="text-center py-4 text-danger small">Failed to load posts.</div>';
    }
}

async function reactPost(postId, reactionType, btnEl) {
    if (window.ITSA && window.ITSA.optimistic) {
        window.ITSA.optimistic.reaction(btnEl, 1);
    }
    try {
        await apiCall(`/api/v1/posts/${postId}/react`, 'POST', { reaction_type: reactionType });
    } catch(e) {}
}

document.getElementById('createPostForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = this.querySelector('button[type="submit"]');
    btn.disabled = true;
    try {
        const formData = new FormData(this);
        await apiCall('{{ url_for("api_posts.create_post") }}', 'POST', formData);
        this.reset();
        loadFeed();
        if (window.ITSA && window.ITSA.toast) window.ITSA.toast.success('Posted!', 'Your post has been shared (+2 pts).');
    } catch(err) {
    } finally {
        btn.disabled = false;
    }
});

document.addEventListener('DOMContentLoaded', loadFeed);
</script>
{% endblock %}
